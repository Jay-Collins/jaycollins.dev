<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111413">
  <meta name="description" content="Justin Collins — software engineer. A new portfolio is in progress. Explore my projects on GitHub or get in touch.">
  <title>Justin Collins — Work in progress</title>
  <style>
    :root { color-scheme: dark; --bg: #111413; --text: #f3f3eb; --muted: #a7ada5; --accent: #c9f584; --line: #353b33; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { min-height: 100svh; max-width: 1440px; margin: auto; padding: 36px clamp(24px, 7vw, 104px); display: flex; flex-direction: column; }
    header, footer { display: flex; justify-content: space-between; gap: 24px; align-items: center; }
    header { padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .name { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    .label { color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .06em; }
    main { flex: 1; display: grid; align-content: center; padding: 88px 0; position: relative; }
    .status { display: flex; align-items: center; gap: 10px; color: var(--accent); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-transform: uppercase; letter-spacing: .12em; }
    .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
    h1 { font-size: clamp(64px, 10vw, 138px); line-height: .98; letter-spacing: -.07em; font-weight: 550; margin: 28px 0 32px; }
    h1 span { color: var(--accent); }
    .intro { max-width: 480px; color: var(--muted); font-size: clamp(17px, 2vw, 20px); line-height: 1.65; margin: 0; }
    .links { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; margin-top: 38px; }
    a { color: inherit; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .primary { display: inline-flex; gap: 32px; justify-content: space-between; align-items: center; background: var(--accent); color: var(--bg); border: 1px solid var(--accent); padding: 16px 20px; font-weight: 650; font-size: 14px; text-decoration: none; border-radius: 3px; }
    .primary:hover { background: #dbffac; }
    .secondary { color: var(--text); font-size: 14px; }
    .secondary:hover { color: var(--accent); }
    footer { border-top: 1px solid var(--line); padding-top: 24px; }
    footer p { margin: 0; }
    @media (max-width: 560px) { .page { padding-top: 24px; padding-bottom: 24px; } header .label { max-width: 110px; text-align: right; } main { padding: 70px 0; } footer { align-items: flex-start; flex-direction: column; gap: 8px; } h1 { font-size: clamp(54px, 14vw, 78px); } }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="name">Justin Collins</span><span class="label">SOFTWARE ENGINEER</span></header>
    <main>
      <div class="status"><span class="dot" aria-hidden="true"></span>Portfolio rebuild underway</div>
      <h1>Work in<br><span>progress.</span></h1>
      <p class="intro">I’m building a new home for my work.<br>In the meantime, explore my projects or say hello.</p>
      <nav class="links" aria-label="Connect with Justin">
        <a class="primary" href="https://github.com/Jay-Collins">Explore GitHub <span aria-hidden="true">↗</span></a>
        <a class="secondary" href="mailto:j.collins.gd@gmail.com">Get in touch</a>
      </nav>
    </main>
    <footer><p class="label">jaycollins.dev</p><p class="label">New portfolio. Same curiosity.</p></footer>
  </div>
</body>
</html>
